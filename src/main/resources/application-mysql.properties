# Execute com: --spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/audiencia_virtual?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=ROOT
spring.datasource.password=ROOT

# Mantem os dados existentes e cria/atualiza apenas o necessario para as entidades.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# O banco MySQL deve iniciar sem dados ficticios.
spring.h2.console.enabled=false
app.seed.enabled=true
